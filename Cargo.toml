[workspace]
members = [
    "crates/znonclip-core",
    "crates/znonclip",
    "crates/znonclip-cli",
    "crates/znonclip-agent",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["ZnonClip contributors", "ClipPin Contributors (upstream)"]
repository = "https://github.com/ZNONNATURALINTELLIGENCE/znonclip"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
directories = "5"
sha2 = "0.10"
